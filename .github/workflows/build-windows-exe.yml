name: build-windows-exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run core tests
        run: cd app && make test

  build:
    name: Build ChromaX.exe (x86_64-windows-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install zig toolchain (pinned, must match the published build)"
        run: pip install ziglang==0.16.0

      - name: Build exe + publish to site/download
        run: cd app && make site

      - name: Print SHA-256
        run: cat site/download/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromaX-windows-x64
          path: |
            site/download/ChromaX.exe
            site/download/SHA256SUMS.txt
            install/ChromaX-setup.bat
            install/ChromaX-uninstall.bat

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ChromaX-windows-x64
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          cat > RELEASE_NOTES.md <<'EOF'
          **ChromaX** — free monitor colour for Windows. One portable x64 exe plus optional shortcut setup scripts; no admin, no account, no telemetry.

          ## Verify the download
          ```
          certutil -hashfile ChromaX.exe SHA256
          ```
          Compare against `SHA256SUMS.txt` in this release. (The site publishes the hash of
          its own copy; builds are not byte-reproducible across machines, so verify the exact
          file you downloaded against the hash published right next to it.)

          ## What it does
          - Saturation to 300% plus vibrance, brightness, contrast, gamma, temperature, tint, RGB, shadows/highlights, black & white point, sharpness and clarity — through the Windows colour layer and GPU gamma ramps.
          - Per-game looks that switch automatically (event-driven foreground detection).
          - HDR where Windows and your driver expose it; "not supported" otherwise.
          - Resolution & refresh manager with tested modes and rollback.
          - Crosshair overlay (nine shapes), phone control over LAN with a random pairing token (connected-device list), backup & last-known-good restore.
          - `ChromaX-setup.bat` adds Start Menu / desktop shortcuts and an optional start-with-Windows entry; the portable EXE runs without it.

          What it never does: read game memory, edit game files, inject code, install drivers, or phone home.
          EOF
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" dist/ChromaX.exe dist/SHA256SUMS.txt \
              dist/ChromaX-setup.bat dist/ChromaX-uninstall.bat --clobber
          else
            gh release create "$VER" \
              --title "ChromaX $VER" \
              --notes-file RELEASE_NOTES.md \
              --target "${GITHUB_SHA}" \
              dist/ChromaX.exe dist/SHA256SUMS.txt \
              dist/ChromaX-setup.bat dist/ChromaX-uninstall.bat
          fi
