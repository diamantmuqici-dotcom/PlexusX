name: build-windows-exe

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zig toolchain
        run: pip install ziglang

      - name: Build ChromaX.exe
        run: cd app && make

      - name: Print SHA-256
        run: sha256sum site/download/ChromaX.exe

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ChromaX
          path: site/download/ChromaX.exe
