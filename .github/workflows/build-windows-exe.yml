name: build-windows-exe

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit & integration test suites
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -O2 -Iapp/src -o /tmp/test_runner tests/test_all.c app/src/games/game_profile.c -lm
          /tmp/test_runner

      - name: Web preview parity vs the C engine kernel
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -Iapp/src tests/parity_gen.c -o /tmp/parity_gen -lm
          /tmp/parity_gen > /tmp/parity.json
          node scripts/site_parity.js --golden /tmp/parity.json
          cmp /tmp/parity.json site/parity.json

      - name: Run engine scenario tests (real engine + pipeline against mocked Win32, ASan + UBSan)
        run: sh tests/host/run.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zig toolchain
        run: pip install ziglang

      - name: Build PlexusX Windows Executables
        run: |
          cd app && make clean && make
          cd ../site/download
          sha256sum PlexusX.exe PlexusX-Setup.exe > SHA256SUMS.txt

      - name: Verify PE subsystem (GUI) and entry points
        run: python3 app/tools/verify_pe.py site/download/PlexusX.exe site/download/PlexusX-Setup.exe

      - name: Print SHA-256 Checksums
        run: cat site/download/SHA256SUMS.txt

      - name: Upload PlexusX Portable Executable
        uses: actions/upload-artifact@v4
        with:
          name: PlexusX-v2.2.0-Portable
          path: site/download/PlexusX.exe

      - name: Upload PlexusX Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: PlexusX-v2.2.0-Setup
          path: site/download/PlexusX-Setup.exe

      - name: Upload SHA-256 Checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: site/download/SHA256SUMS.txt
